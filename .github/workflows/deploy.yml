name: Deploy

on:
  push:
    branches: [main, dev, test]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      branch: ${{ steps.env.outputs.branch }}
      dir: ${{ steps.env.outputs.dir }}
      pm2_name: ${{ steps.env.outputs.pm2_name }}
    steps:
      - name: Determine environment
        id: env
        run: |
          BRANCH="${GITHUB_REF##*/}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          case "$BRANCH" in
            main)
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "dir=prod_env" >> "$GITHUB_OUTPUT"
              echo "pm2_name=ProdServer" >> "$GITHUB_OUTPUT"
              ;;
            test)
              echo "environment=test" >> "$GITHUB_OUTPUT"
              echo "dir=test_env" >> "$GITHUB_OUTPUT"
              echo "pm2_name=TestServer" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "environment=dev" >> "$GITHUB_OUTPUT"
              echo "dir=dev_env" >> "$GITHUB_OUTPUT"
              echo "pm2_name=DevServer" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Build app
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            lxc exec company-profiler -- sudo --login --user company-profiler bash -ilc "
              cd ~ && \
              source ~/.nvm/nvm.sh && \
              nvm use 22 && \
              rm -rf ${{ needs.setup.outputs.dir }} && \
              git clone --branch ${{ needs.setup.outputs.branch }} https://${{ secrets.GITHUBUSERNAME }}:${{ secrets.GITHUBTOKEN }}@github.com/infocast-tw/company_profiles.git ${{ needs.setup.outputs.dir }} && \
              cd ${{ needs.setup.outputs.dir }} && \
              printf 'PGHOST=${{ secrets.PGHOST }}\nPGPORT=${{ secrets.PGPORT }}\nPGUSER=${{ secrets.PGUSER }}\nPGPASSWORD=${{ secrets.PGPASSWORD }}\nPGDATABASE=${{ secrets.PGDATABASE }}\nPGSCHEMA=${{ secrets.PGSCHEMA }}\nPORT=${{ vars.PORT }}\nMONITOR_DAILY_AT=${{ vars.MONITOR_DAILY_AT }}\nSEC_EDGAR_CONTACT=${{ vars.SEC_EDGAR_CONTACT }}\nSESSION_SECRET=${{ secrets.SESSION_SECRET }}\n' > .env && \
              npm install && \
              npm run build
            "

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Deploy app
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            lxc exec company-profiler -- sudo --login --user company-profiler bash -ilc "
              source ~/.nvm/nvm.sh && \
              nvm use 22 && \
              pm2 stop ${{ needs.setup.outputs.pm2_name }} || true; \
              pm2 delete ${{ needs.setup.outputs.pm2_name }} || true; \
              cd ${{ needs.setup.outputs.dir }}; \
              pm2 start npm --name ${{ needs.setup.outputs.pm2_name }} -- start -- -p 3000; \
              pm2 save;
            "
